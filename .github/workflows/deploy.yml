name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  AZURE_BACKEND_APP_NAME: 'acs-phone-backend'  # Change this to your app name
  AZURE_RESOURCE_GROUP: 'acs-phone-system-rg'   # Change this to your resource group

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build application
        working-directory: ./backend
        run: npm run build

      - name: Create deployment package
        working-directory: ./backend
        run: |
          cp package.json dist/
          cp package-lock.json dist/
          cd dist
          npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_BACKEND_APP_NAME }}
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          package: ./backend/dist

      - name: Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_BACKEND_APP_NAME }}
          app-settings-json: |
            [
              {
                "name": "ACS_CONNECTION_STRING",
                "value": "${{ secrets.ACS_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "ACS_PHONE_NUMBER",
                "value": "${{ secrets.ACS_PHONE_NUMBER }}",
                "slotSetting": false
              },
              {
                "name": "CALLBACK_URI",
                "value": "https://${{ env.AZURE_BACKEND_APP_NAME }}.azurewebsites.net/api/callbacks",
                "slotSetting": false
              },
              {
                "name": "FRONTEND_URL",
                "value": "${{ secrets.FRONTEND_URL }}",
                "slotSetting": false
              },
              {
                "name": "NODE_ENV",
                "value": "production",
                "slotSetting": false
              }
            ]

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        env:
          VITE_API_URL: https://${{ env.AZURE_BACKEND_APP_NAME }}.azurewebsites.net/api
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/frontend'
          output_location: 'dist'
